<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的聊天</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f5f5;
    }

    .app {
      max-width: 700px;
      margin: auto;
      height: 100vh;
      display: flex;
      flex-direction: column;
      background: white;
    }

    header {
      padding: 16px;
      background: #1677ff;
      color: white;
      font-size: 20px;
      font-weight: bold;
      text-align: center;
    }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 15px;
    }

    .message {
      margin-bottom: 12px;
      padding: 10px 14px;
      border-radius: 16px;
      background: #f0f0f0;
      max-width: 85%;
      word-break: break-word;
    }

    .username {
      font-size: 12px;
      color: #777;
      margin-bottom: 4px;
    }

    .message img {
      max-width: 100%;
      border-radius: 10px;
      margin-top: 5px;
    }

    .bottom {
      padding: 10px;
      border-top: 1px solid #ddd;
      display: flex;
      gap: 8px;
      background: white;
    }

    input[type="text"] {
      flex: 1;
      min-width: 0;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 20px;
      font-size: 16px;
    }

    button {
      border: none;
      border-radius: 20px;
      padding: 10px 16px;
      background: #1677ff;
      color: white;
      font-size: 15px;
    }

    .image-btn {
      background: #555;
      padding: 10px 13px;
    }

    #imageInput {
      display: none;
    }
  </style>
</head>

<body>

<div class="app">

  <header>💬 我的聊天</header>

  <div id="messages">
    正在加载消息……
  </div>

  <div class="bottom">

    <label class="image-btn button">
      🖼️
      <input id="imageInput" type="file" accept="image/*">
    </label>

    <input
      id="messageInput"
      type="text"
      placeholder="输入消息……"
    >

    <button onclick="sendMessage()">发送</button>

  </div>

</div>

<script>

const SUPABASE_URL =
  "https://ouvvrkzppumxblfhwlun.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_jNF0kbjpKjqWqRO9gF27Ug_w_tcp11K";

const supabase = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


// ======================
// 加载消息
// ======================

async function loadMessages() {

  const { data, error } = await supabase
    .from("messages")
    .select("*")
    .order("created_at", { ascending: true });

  if (error) {
    console.error(error);
    document.getElementById("messages").innerHTML =
      "加载失败，请检查 Supabase 权限设置。";
    return;
  }

  showMessages(data || []);
}


// ======================
// 显示消息
// ======================

function showMessages(data) {

  const box = document.getElementById("messages");

  box.innerHTML = "";

  data.forEach(message => {

    const div = document.createElement("div");

    div.className = "message";

    div.innerHTML = `
      <div class="username">
        ${escapeHtml(message.username || "用户")}
      </div>

      <div>
        ${escapeHtml(message.content || "")}
      </div>

      ${
        message.image_url
        ? `<img src="${message.image_url}">`
        : ""
      }
    `;

    box.appendChild(div);

  });

  box.scrollTop = box.scrollHeight;
}


// ======================
// 发送文字
// ======================

async function sendMessage() {

  const input =
    document.getElementById("messageInput");

  const text = input.value.trim();

  if (!text) return;

  const username =
    localStorage.getItem("chat_username") ||
    "用户";

  const { error } = await supabase
    .from("messages")
    .insert({
      username: username,
      content: text,
      image_url: null
    });

  if (error) {

    alert("发送失败：" + error.message);

    console.error(error);

    return;
  }

  input.value = "";

  loadMessages();
}


// ======================
// 图片上传
// ======================

document
  .getElementById("imageInput")
  .addEventListener("change", async function() {

    const file = this.files[0];

    if (!file) return;

    const username =
      localStorage.getItem("chat_username") ||
      "用户";

    const fileName =
      Date.now() + "-" + file.name;

    const filePath =
      "images/" + fileName;


    const { error: uploadError } =
      await supabase.storage
        .from("chat-images")
        .upload(filePath, file);


    if (uploadError) {

      alert("图片上传失败：" + uploadError.message);

      console.error(uploadError);

      return;
    }


    const { data } =
      supabase.storage
        .from("chat-images")
        .getPublicUrl(filePath);


    const imageUrl = data.publicUrl;


    const { error } =
      await supabase
        .from("messages")
        .insert({

          username: username,

          content: "🖼️ 图片",

          image_url: imageUrl

        });


    if (error) {

      alert("图片消息发送失败：" + error.message);

      console.error(error);

      return;
    }


    this.value = "";

    loadMessages();

  });


// ======================
// 防止消息里的 HTML 代码执行
// ======================

function escapeHtml(text) {

  const div =
    document.createElement("div");

  div.textContent = text;

  return div.innerHTML;
}


// ======================
// 自动刷新
// ======================

loadMessages();

setInterval(loadMessages, 3000);

</script>

</body>
</html>
